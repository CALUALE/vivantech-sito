<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vivantech Finestre</title>
<meta name="description" content="Vivantech serramenti: tocca una finestra per aprirla e scoprire il profilo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout: black showroom; title band; four real window photos (2 ante) that swing open on a 3D hinge to reveal the profile corner of each system (Tecnoplast sheets); finish swatches under each. Single dark theme by design. */
:root{--bg:#050608;--bg2:#0b0e13;--fg:#eef1f5;--muted:#8d97a6;--line:#1f2630;--accent:#35d0ff;--accent2:#7cf0c0;--display:'Michroma',Arial,sans-serif;--body:'Manrope',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:28px 48px;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 500px at 50% -10%,rgba(53,208,255,.14),transparent 60%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto}
header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:38px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,64px);letter-spacing:.28em;margin:0;text-transform:uppercase;background:linear-gradient(90deg,#fff 0%,var(--accent) 55%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:470px){.grid{grid-template-columns:1fr}}
.unit{display:flex;flex-direction:column;gap:14px;min-width:0;--tint:#ffffff;--tintA:0}
.name{display:flex;flex-direction:column;gap:3px;min-height:46px}
.name b{font-size:15px;letter-spacing:.04em}
.name span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.scene{perspective:1300px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:8px}
.photo{position:relative;aspect-ratio:415/745;max-width:100%;border-radius:8px;overflow:hidden;background:#111;box-shadow:0 30px 60px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08);transition:box-shadow .6s}
.scene.open .photo{box-shadow:0 0 0 1px rgba(53,208,255,.45),0 0 70px -10px rgba(53,208,255,.5),0 30px 60px -30px rgba(0,0,0,.9)}
.photo img.base{position:absolute;inset:0;width:100%;height:100%;display:block}
.tint{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tint path{fill:var(--tint);fill-opacity:var(--tintA);transition:fill-opacity .4s}
.opening{position:absolute;left:11.08%;top:7.79%;width:78.55%;height:86.85%;clip-path:polygon(0 0,100% 4.6%,100% 98%,0 100%)}
.inside{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(70% 55% at 50% 42%,rgba(53,208,255,.28),rgba(5,6,8,.1) 70%),#06080c;opacity:0;transition:opacity .5s .25s}
.scene.open .inside{opacity:1}
.inside img{width:84%;height:auto;max-height:80%;object-fit:contain;filter:drop-shadow(0 16px 26px rgba(0,0,0,.85));transform:translateY(-6%)}
.inside .lbl{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2)}
.light{position:absolute;inset:-20%;z-index:2;background:radial-gradient(closest-side,rgba(255,255,255,.4),rgba(53,208,255,.18) 40%,transparent 70%);opacity:0;transform:scale(.4);transition:opacity .7s,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none;mix-blend-mode:screen}
.scene.open .light{opacity:1;transform:scale(1)}
.sash{position:absolute;z-index:4;overflow:hidden;transition:transform 1.15s cubic-bezier(.25,.9,.25,1);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sash img{position:absolute;display:block;max-width:none}
.sash svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sash.l{left:11.08%;top:7.79%;width:40%;height:86.71%;transform-origin:left center}
.sash.l img{width:250%;left:-27.71%;top:-8.98%}
.sash.r{left:51.08%;top:9.93%;width:38.55%;height:84.03%;transform-origin:right center}
.sash.r img{width:259.4%;left:-132.5%;top:-11.82%}
.scene.open .sash.l{transform:rotateY(-118deg)}
.scene.open .sash.r{transform:rotateY(118deg)}
.scene.open .sash{box-shadow:12px 0 30px rgba(0,0,0,.6)}
.hint{position:absolute;left:0;right:0;bottom:2.5%;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.8);z-index:5;transition:opacity .3s;pointer-events:none}
.scene.open .hint{opacity:0}
.sw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw button{appearance:none;border:2px solid transparent;border-radius:999px;width:34px;height:34px;cursor:pointer;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.6);transition:transform .2s,border-color .2s;padding:0}
.sw button:hover{transform:scale(1.08)}
.sw button[aria-pressed="true"]{border-color:var(--accent)}
.sw button:focus-visible,.scene:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sw small{color:var(--muted);font-size:12px;letter-spacing:.06em;min-width:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);border:1px solid rgba(124,240,192,.35);border-radius:999px;padding:4px 10px;width:max-content;max-width:100%}
footer{margin-top:44px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.1em;line-height:1.6}
@media(prefers-reduced-motion:reduce){.sash,.light,.inside,.photo{transition:none}}
</style>
</head>
