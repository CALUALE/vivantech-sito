:root{--bg:#050608;--fg:#eef1f5;--muted:#8d97a6;--line:#1f2630;--accent:#35d0ff;--accent2:#7cf0c0;--display:'Michroma',Arial,sans-serif;--body:'Manrope',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
button{font-family:inherit}
.top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:rgba(5,6,8,.7);backdrop-filter:blur(10px);border-bottom:1px solid rgba(53,208,255,.18)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;min-width:0}
.brand img{width:46px;height:auto;flex:none}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(16px,3vw,28px);letter-spacing:.26em;margin:0;text-transform:uppercase;background:linear-gradient(90deg,#fff,var(--accent) 55%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.top a.tel{color:var(--fg);text-decoration:none;border:1px solid rgba(53,208,255,.35);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
#bg{position:fixed;inset:0;background:radial-gradient(1200px 700px at 50% 110%,rgba(53,208,255,.16),transparent 60%),radial-gradient(900px 500px at 50% -20%,rgba(124,240,192,.06),transparent 60%),#050608}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.ttl{position:fixed;left:0;right:0;top:clamp(70px,9vh,92px);text-align:center;pointer-events:none;transition:opacity .6s}
.ttl h2{font-family:var(--display);font-weight:400;font-size:clamp(13px,1.7vw,21px);letter-spacing:.24em;text-transform:uppercase;margin:0;text-shadow:0 0 30px rgba(53,208,255,.5)}
.ttl p{margin:6px 0 0;color:var(--muted);font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.lbl{position:fixed;transform:translate(-50%,0);appearance:none;background:none;border:0;color:var(--fg);cursor:pointer;text-align:center;padding:6px 10px;transition:opacity .5s}
.lbl b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(11px,1.4vw,17px);letter-spacing:.2em;text-transform:uppercase}
.lbl span{display:block;font-size:clamp(9px,1vw,12px);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.lbl:focus-visible{outline:2px solid var(--accent);border-radius:8px}
.busy .ttl,.busy .lbl,.busy #guides{opacity:0;pointer-events:none}
#fib{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;transition:opacity .9s}
#fib.quiet{opacity:0}
#guides{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .6s;z-index:2}
#guides path{fill:none;stroke-linecap:round}
#guides .g0{stroke:url(#gg);stroke-width:1.2;opacity:.55}
#guides .g1{stroke:#dff8ff;stroke-width:2;stroke-dasharray:18 260;animation:run 3.2s linear infinite;filter:drop-shadow(0 0 6px #35d0ff)}
#guides circle{fill:#bff3ff;filter:drop-shadow(0 0 6px #35d0ff)}
@keyframes run{from{stroke-dashoffset:278}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#guides .g1{animation:none;display:none}}
#beam{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;mix-blend-mode:screen;opacity:0}
.info.on .prof img{filter:drop-shadow(0 0 40px rgba(190,240,255,.85)) drop-shadow(0 0 90px rgba(53,208,255,.6)) drop-shadow(0 20px 24px rgba(0,0,0,.8))}
.info{position:fixed;left:max(4vw,16px);top:50%;transform:translateY(-50%);width:min(29vw,400px);display:flex;flex-direction:column;gap:12px;opacity:0;pointer-events:none;transition:opacity .8s;z-index:10}
.info.on{opacity:1;pointer-events:auto}
.colors{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:rgba(4,6,9,.78);border:1px solid rgba(53,208,255,.2);transition:opacity .5s}
.colors.in{position:static;transform:none;background:none;border:0;padding:0;flex-wrap:wrap}
body.busy #colors{opacity:0;pointer-events:none}
.colors>span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.colors button{appearance:none;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0;box-shadow:inset 0 -3px 6px rgba(0,0,0,.25);transition:transform .2s,border-color .2s}
.colors button[aria-pressed="true"]{border-color:#fff;transform:scale(1.12);box-shadow:0 0 0 3px rgba(53,208,255,.55)}
.colors button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.colors .cn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#e9f4f8;min-width:84px}

.info.on .prof img{transform:none;opacity:1}
.tabs{display:flex;flex-wrap:wrap;gap:8px}

.info .prof{flex-direction:column;justify-content:center;gap:8px}

.info.on .zh{opacity:.85}
.lens{position:fixed;z-index:45;width:210px;height:210px;border-radius:50%;pointer-events:none;display:none;background-color:#05070a;background-repeat:no-repeat;
 border:2px solid rgba(200,245,255,.9);box-shadow:0 0 0 6px rgba(53,208,255,.12),0 0 40px rgba(53,208,255,.55),inset 0 0 24px rgba(0,0,0,.55)}
.lens::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 40%)}

.info .prof img.photo{border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.info .prof img.sw{opacity:0!important;transform:translateX(-14px) scale(.95)!important}
.info ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.45;color:#d7dde5}
.info li::before{content:"— ";color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.cta{appearance:none;border:0;background:linear-gradient(90deg,var(--accent),#7cf0c0);color:#06202a;font-weight:800;border-radius:999px;padding:10px 18px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.ghost{appearance:none;background:rgba(5,6,8,.6);border:1px solid rgba(255,255,255,.35);color:var(--fg);border-radius:999px;padding:9px 18px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.cta:focus-visible,.ghost:focus-visible{outline:2px solid #fff;outline-offset:2px}
#close{position:fixed;top:78px;right:16px;z-index:20;display:none}
.busy #close{display:inline-block}
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,4,6,.95);display:flex;flex-direction:column}
.ov[hidden]{display:none}
.ovh{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.ovh h4{flex:1;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(14px,2vw,20px);letter-spacing:.14em;text-transform:uppercase}
.ovb{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start}
.ovb img{max-width:min(960px,100%);border-radius:6px;display:block}
.ovb figure{margin:0;max-width:min(960px,100%)}
.ovb figcaption{margin-top:8px;text-align:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#cfe9f2}
.ovb.two{flex-wrap:wrap;gap:18px}
.ovb.two figure{flex:1 1 360px;max-width:640px}
.ovb.two img{width:100%;max-width:none}
.info h3 small{font-size:.5em;letter-spacing:.2em;opacity:.8;margin-left:.4em;vertical-align:middle}
.info .hl{margin:8px 0 0;display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em;color:#062b14;background:linear-gradient(90deg,#7ee8a5,#35d0ff)}
.info .hl[hidden]{display:none}
#err{position:fixed;inset:auto 16px 16px 16px;color:var(--muted);font-size:13px;text-align:center;display:none}
@media (max-width:760px){
 .info{left:16px;right:16px;width:auto;top:auto;bottom:16px;transform:none;gap:8px}
 .info .prof{position:static;transform:none;height:118px}
 .prof.duo .prow img{max-width:38vw}
 .pcap{font-size:9px;width:auto;justify-content:center;gap:14px}
 .info ul{font-size:12.5px}
 .top{padding:8px 12px}.brand img{width:36px}.brand small{font-size:9px}
 #close{top:66px}
}
</style>

const canvas=document.getElementById('c');

/* ---------- materiali ---------- */
function woodTexture(c0='#6f5132',c1='#7b5b3a',c2='#6a4d2f',dk=[48,30,14],lt=[170,135,90]){

 const Wd=512,Hd=2048,c=document.createElement('canvas');c.width=Wd;c.height=Hd;const g=c.getContext('2d');
 const grd=g.createLinearGradient(0,0,Wd,0);grd.addColorStop(0,c0);grd.addColorStop(.5,c1);grd.addColorStop(1,c2);

 for(let i=0;i<5200;i++){const x=rnd()*Wd,y=rnd()*Hd;g.fillStyle=`rgba(55,35,15,${.12+rnd()*.25})`;g.fillRect(x,y,.8,3+rnd()*9)}
 for(let k=0;k<4;k++){const cx=rnd()*Wd,cy=rnd()*Hd;for(let r=3;r<60;r+=3.5){g.strokeStyle=`rgba(75,48,22,${.10})`;g.lineWidth=1;g.beginPath();g.ellipse(cx,cy,r*.4,r*3.2,0,0,Math.PI*2);g.stroke()}}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
function grainTexture(base,amt){ // leggera grana per verniciatura/pvc
 const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,256,256);

const COLORI=[
 {k:'bianco',n:'Bianco',sw:'#f1f1ec',tex:()=>grainTexture('#f1f1ec',5),rough:.38},

 pvc:()=>new THREE.MeshPhysicalMaterial({map:texOf(COLORI[0]),roughness:.38,clearcoat:.25,clearcoatRoughness:.35,sheen:.2,sheenColor:0xffffff}),
 fib:()=>new THREE.MeshPhysicalMaterial({map:texOf(COLORI[0]),roughness:.38,clearcoat:.25,clearcoatRoughness:.35}),
 alu:()=>new THREE.MeshPhysicalMaterial({map:texOf(COLORI[0]),metalness:.15,roughness:.42,clearcoat:.3,clearcoatRoughness:.45})
};
const STYLE={ // r = raggio spigoli, step = sporgenza anta, bead = fermavetro 'bev'|'sq'
 pvc:{r:.0035,rs:.006,step:.007,bead:'bev',glass:.024},
 fib:{r:.0025,rs:.004,step:.005,bead:'bev',glass:.032},
 alu:{r:.0007,rs:.0008,step:.002,bead:'sq',glass:.028}
};
const glassMat=new THREE.MeshPhysicalMaterial({color:0xeaf6f4,metalness:0,roughness:.02,transparent:true,opacity:.2,envMapIntensity:4,clearcoat:1,clearcoatRoughness:.02,depthWrite:false});
const glassEdge=new THREE.MeshPhysicalMaterial({color:0x7fb8a8,roughness:.1,transparent:true,opacity:.55});
const viewTex=new THREE.TextureLoader().load('../img/vista.jpg');viewTex.colorSpace=THREE.SRGBColorSpace;
const viewMat=new THREE.MeshBasicMaterial({map:viewTex,side:THREE.FrontSide,toneMapped:false});
const rubber=new THREE.MeshStandardMaterial({color:0x151617,roughness:.9});
const spacerMat=new THREE.MeshStandardMaterial({color:0x2b2d2f,metalness:.3,roughness:.55});

function box(w,h,d,mat,r=.004){const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,Math.min(r,w/2-.0005,h/2-.0005,d/2-.0005)),mat);m.castShadow=true;m.receiveShadow=true;return m}

/* poligono (u = verso l'interno della cornice, z = profondità) con spigoli arrotondati */
function rpoly(pts,radii){const out=[];const n=pts.length;
 for(let i=0;i<n;i++){const r=radii[i]||0,p=pts[i];if(!r){out.push(p);continue}
  const a=pts[(i-1+n)%n],b=pts[(i+1)%n];const v1=[a[0]-p[0],a[1]-p[1]],v2=[b[0]-p[0],b[1]-p[1]];
  const l1=Math.hypot(...v1),l2=Math.hypot(...v2);const u1=[v1[0]/l1,v1[1]/l1],u2=[v2[0]/l2,v2[1]/l2];
  const rr=Math.min(r,l1*.45,l2*.45);const p1=[p[0]+u1[0]*rr,p[1]+u1[1]*rr],p2=[p[0]+u2[0]*rr,p[1]+u2[1]*rr];
  for(let k=0;k<=5;k++){const t=k/5,q=(1-t)*(1-t),w=2*(1-t)*t,e=t*t;out.push([q*p1[0]+w*p[0]+e*p2[0],q*p1[1]+w*p[1]+e*p2[1]])}}
 return out}
/* cornice con tagli a 45°: estrude la sezione lungo i 4 lati di un rettangolo w×h */
function mitre(pts,w,h,mat,opts={}){
 let A=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];A+=p[0]*q[1]-q[0]*p[1]}
 const P=A<0?pts.slice().reverse():pts,n=P.length;
 // normali 2D (verso l'esterno del poligono) con smussatura sugli archi
 const en=[];for(let i=0;i<n;i++){const p=P[i],q=P[(i+1)%n],dx=q[0]-p[0],dz=q[1]-p[1],l=Math.hypot(dx,dz)||1;en.push([dz/l,-dx/l])}
 const vn=[];for(let i=0;i<n;i++){const a=en[(i-1+n)%n],b=en[i],dot=a[0]*b[0]+a[1]*b[1];vn.push(dot>.82?(()=>{const x=a[0]+b[0],z=a[1]+b[1],l=Math.hypot(x,z);return[x/l,z/l]})():null)}
 const per=[0];for(let i=0;i<n;i++){const p=P[i],q=P[(i+1)%n];per.push(per[i]+Math.hypot(q[0]-p[0],q[1]-p[1]))}
 const sides=[ // origine bordo esterno, direzione lungo, direzione verso interno, lunghezza
  {o:(u,a)=>{const x0=-w/2+u*K[3],x1=w/2-u*K[1];return[x0+a*(x1-x0),-h/2+u*K[0]]},dn:[0,1],k:0},
  {o:(u,a)=>{const y0=-h/2+u*K[0],y1=h/2-u*K[2];return[w/2-u*K[1],y0+a*(y1-y0)]},dn:[-1,0],k:1},
  {o:(u,a)=>{const x0=w/2-u*K[1],x1=-w/2+u*K[3];return[x0+a*(x1-x0),h/2-u*K[2]]},dn:[0,-1],k:2},
  {o:(u,a)=>{const y0=h/2-u*K[2],y1=-h/2+u*K[0];return[-w/2+u*K[3],y0+a*(y1-y0)]},dn:[1,0],k:3}];
 const pos=[],nor=[],uv=[];const sc=opts.uv||1;const K=opts.k||[1,1,1,1];
 sides.forEach((S,si)=>{const L=si%2?h:w;
  for(let i=0;i<n;i++){const p=P[i],q=P[(i+1)%n];
   const np=vn[i]||en[i],nq=vn[(i+1)%n]||en[i];
   const V=(pt,a)=>{const xy=S.o(pt[0],a);return[xy[0],xy[1],pt[1]]};
   const N=nn=>{const a=nn[0]/K[S.k],b=nn[1],l=Math.hypot(a,b);return[a/l*S.dn[0],a/l*S.dn[1],b/l]};
   const v=[V(p,0),V(q,0),V(q,1),V(p,1)],nv=[N(np),N(nq),N(nq),N(np)];
   const t=[[per[i]*sc*4,0],[per[i+1]*sc*4,0],[per[i+1]*sc*4,L*sc],[per[i]*sc*4,L*sc]];
   // verifica orientamento del triangolo rispetto alla normale
   const e1=[v[1][0]-v[0][0],v[1][1]-v[0][1],v[1][2]-v[0][2]],e2=[v[2][0]-v[0][0],v[2][1]-v[0][1],v[2][2]-v[0][2]];
   const cr=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];const en3=N(en[i]);
   const ord=(cr[0]*en3[0]+cr[1]*en3[1]+cr[2]*en3[2])>=0?[0,1,2,0,2,3]:[0,2,1,0,3,2];
   ord.forEach(k=>{pos.push(...v[k]);nor.push(...nv[k]);uv.push(...t[k])})}});
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 geo.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 const m=new THREE.Mesh(geo,mat);m.castShadow=opts.shadow!==false;m.receiveShadow=true;return m}

/* ---------- costruzione finestra (sezioni semplificate dai profili reali) ---------- */
function buildWindow(p){
 const g=new THREE.Group(),mat=MAT[p.k](),st=STYLE[p.k];
 const f=p.frame,D=p.depth,s=p.sash,ov=.009,zf=D/2,z1=zf+st.step,zb=-D/2+.008,T=st.glass,gz=-.004,gi=gz+T/2,ge=gz-T/2;
 // telaio con battuta per l'anta
 const fr=rpoly([[0,-D/2],[f,-D/2],[f,zf-.024],[f-ov-.003,zf-.024],[f-ov-.003,zf],[0,zf]],[st.r*.5,st.r*.5,0,0,st.r,st.r]);
 g.add(mitre(fr,W,H,mat));
 // ante
 const ow=W-2*(f-ov),oh=H-2*(f-ov),sw=ow/2-.0015,sh=oh;
 const sashP=rpoly([[0,zf-.022],[ov+.003,zf-.022],[ov+.003,zb],[s+.004,zb],[s+.004,ge-.001],[s-.004,ge-.001],[s-.004,z1],[0,z1]],[0,0,st.r*.5,st.r*.5,0,0,st.rs,st.rs]);
 const beadP=st.bead==='bev'
  ?rpoly([[s-.004,gi+.001],[s+.015,gi+.001],[s+.015,gi+.006],[s+.004,z1-.003],[s-.004,z1-.003]],[0,0,st.r*.6,st.r,0])
  :rpoly([[s-.004,gi+.001],[s+.013,gi+.001],[s+.013,z1-.003],[s-.004,z1-.003]],[0,0,st.r,0]);
 const gasI=[[s+.0145,gi],[s+.0185,gi],[s+.0185,gi+.0035],[s+.0145,gi+.005]];
 const gasE=[[s+.003,ge-.004],[s+.007,ge-.004],[s+.007,ge],[s+.003,ge]];
 const spc=[[s-.010,gz-T/2+.005],[s+.022,gz-T/2+.005],[s+.022,gz+T/2-.005],[s-.010,gz+T/2-.005]];
 const KM=[.58,.8];
 function sash(side){
  const piv=new THREE.Group();piv.position.set(side*(W/2-f+ov),0,zf);
  const a=new THREE.Group();a.position.set(-side*sw/2,0,-zf);piv.add(a);
  // nodo centrale: anta senza maniglia più stretta, anta con maniglia più larga (montante asimmetrico)
  const km=side<0?KM[0]:KM[1],K=side<0?[1,km,1,1]:[1,1,1,km],o={k:K},o2={k:K,shadow:false};
  a.add(mitre(sashP,sw,sh,mat,o));a.add(mitre(beadP,sw,sh,mat,o));
  a.add(mitre(gasI,sw,sh,rubber,o2));a.add(mitre(gasE,sw,sh,rubber,o2));
  a.add(mitre(spc,sw,sh,spacerMat,o2));
  // vetrocamera: due lastre
  const ge0=s-.010,xl=-sw/2+ge0*K[3],xr=sw/2-ge0*K[1],gw=xr-xl,gh=sh-2*ge0;
  [gz+T/2-.002,gz-T/2+.002].forEach(z=>{const gl=new THREE.Mesh(new THREE.BoxGeometry(gw,gh,.004),[glassEdge,glassEdge,glassEdge,glassEdge,glassMat,glassMat]);gl.position.set((xl+xr)/2,0,z);gl.renderOrder=2;a.add(gl)});
  // cerniere (lato telaio): copricerniera colore profilo + perno
  const hx=side*(sw/2+.004);
  [sh/2-.14,-sh/2+.14].forEach(y=>{
   const c=new THREE.Mesh(new THREE.CylinderGeometry(.0075,.0075,.085,24),mat);c.position.set(hx,y,z1-.004);c.castShadow=true;a.add(c);
   [1,-1].forEach(e=>{const cap=new THREE.Mesh(new THREE.SphereGeometry(.0075,16,8,0,Math.PI*2,0,Math.PI/2),mat);cap.position.set(hx,y+e*.0425,z1-.004);cap.rotation.x=e>0?0:Math.PI;a.add(cap)})});
  return {piv,a};
 }
 const L=sash(-1),R=sash(1);g.add(L.piv,R.piv);
 // riporto centrale sull'anta con maniglia
 const ripE=.016,ripW=ripE+.012;const rip=box(ripW,sh-.004,.006,mat,st.rs*.6);rip.position.set(-sw/2-ripE+ripW/2,0,z1+.001);R.a.add(rip);
 // maniglia (rosetta + leva) in alluminio satinato
 const hx=(-sw/2-ripE+(-sw/2+(s-.004)*KM[1]))/2,hz=z1+.006;
 const ros=box(.03,.078,.012,steel,.006);ros.position.set(hx,.01,hz+.002);R.a.add(ros);
 const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,.03),new THREE.Vector3(0,-.012,.045),new THREE.Vector3(0,-.05,.05),new THREE.Vector3(0,-.13,.048)]);
 const lev=new THREE.Mesh(new THREE.TubeGeometry(curve,48,.0075,20,false),steel);lev.scale.x=1.25;lev.position.set(hx,.01,hz+.006);lev.castShadow=true;R.a.add(lev);
 const end=new THREE.Mesh(new THREE.SphereGeometry(.0075,20,12),steel);end.scale.x=1.25;end.position.set(hx,.01-.13,hz+.006+.048);R.a.add(end);
 const view=new THREE.Mesh(new THREE.PlaneGeometry(ow+.02,oh+.02),viewMat);view.position.z=-D/2-.03;g.add(view);
 g.userData={p,L:L.piv,R:R.piv,mat,ow,oh,D};
 g.traverse(o=>{if(o.isMesh)o.userData.win=g});
 return g;
}
const wins=M.map((p,i)=>{const w=buildWindow(p);w.position.x=(i-1)*GAP;scene.add(w);return w});

/* ---------- tween ---------- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
let token=0;
function tween(dur,fn,e=ease){const my=token;return new Promise(res=>{const t0=performance.now();
 (function step(now){if(my!==token)return res(false);const t=Math.min(1,(now-t0)/dur);fn(e(t));if(t<1)requestAnimationFrame(step);else res(true)})(t0)})}
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- interazione ---------- */
const info=document.getElementById('info');let cur=null,busy=false;
async function choose(i){
 if(busy)return;busy=true;document.body.classList.add('busy');cur=M[i];
 const w=wins[i],others=wins.filter(x=>x!==w);
 document.getElementById('iTag').textContent=cur.label+(cur.sub?' · '+cur.sub:'');
 const tabs=document.getElementById('iTabs');tabs.innerHTML='';
 if(cur.models.length>1)cur.models.forEach((x,k)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=x.model;b.addEventListener('click',()=>showModel(k));tabs.appendChild(b)});
 showModel(0,true);
 const x0=w.position.x,oy=others.map(o=>o.position.y);
 const fwd=mobile?home.camZ*.45:1.4,half=(home.camZ-fwd)*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
 // 1. le altre scendono e spariscono, la scelta viene avanti al centro
 if(!(await tween(1100,t=>{w.position.x=lerp(x0,0,t);w.position.z=lerp(0,fwd,t);
   others.forEach((o,k)=>{o.position.y=lerp(oy[k],-4,t);o.position.z=lerp(0,-1.5,t)})})))return;
 others.forEach(o=>o.visible=false);
 // 2. un giro completo, lento
 if(!(await tween(5200,t=>{w.rotation.y=t*Math.PI*2})))return;w.rotation.y=0;
 // 3. si sposta a destra (su telefono sale)
 const tx=mobile?0:1.02,ty=mobile?half*.42:0,tz=mobile?fwd:.9;
 if(!(await tween(1100,t=>{w.position.x=lerp(0,tx,t);w.position.y=lerp(0,ty,t);w.position.z=lerp(fwd,tz,t);w.rotation.y=lerp(0,-.42,t)})))return;
 // 4. le ante si aprono fino in fondo
 const A=THREE.MathUtils.degToRad(168);
 if(!(await tween(2600,t=>{w.userData.L.rotation.y=-A*t;w.userData.R.rotation.y=A*t},easeOut)))return;
 sel=w;info.classList.add('on');
 viewMat.color.setScalar(1);await tween(900,t=>{beamT=t;viewMat.color.setScalar(1+t*.7)},easeOut);
 document.getElementById('close').focus({preventScroll:true});
}
function closeAll(){token++;busy=false;sel=null;beamT=0;viewMat.color.setScalar(1);info.classList.remove('on');document.body.classList.remove('busy');
 wins.forEach((w,i)=>{w.visible=true;w.position.set((i-1)*GAP,0,0);w.rotation.set(0,0,0);w.userData.L.rotation.y=0;w.userData.R.rotation.y=0})}
document.getElementById('close').addEventListener('click',closeAll);
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
canvas.addEventListener('click',e=>{if(busy)return;ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
 const hit=ray.intersectObjects(wins,true)[0];if(hit){const i=wins.indexOf(hit.object.userData.win);if(i>=0)choose(i)}});
canvas.addEventListener('pointermove',e=>{if(busy){canvas.style.cursor='';return}ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);canvas.style.cursor=ray.intersectObjects(wins,true).length?'pointer':''});
let curM=null;
function showModel(k,instant){curM=cur.models[k];
 [...document.getElementById('iTabs').children].forEach((b,j)=>b.setAttribute('aria-selected',j===k?'true':'false'));
 const im=document.getElementById('iImg'),apply=()=>{im.src='../img/'+curM.img;im.alt=(curM.photo?'Foto ':curM.sez?'Sezione del nodo centrale ':'Profilo ')+curM.model;im.classList.toggle('photo',!!curM.photo);
  {const i2=document.getElementById('iImg2'),pc=document.getElementById('pcap');i2.hidden=!curM.img2;pc.hidden=!curM.caps;document.getElementById('prof').classList.toggle('duo',!!curM.img2);if(curM.img2){i2.src='../img/'+curM.img2;i2.alt='Profilo '+curM.model+' '+(curM.caps?curM.caps[1]:'')}if(curM.caps){document.getElementById('iCap1').textContent=curM.caps[0];document.getElementById('iCap2').textContent=curM.caps[1]}}document.getElementById('iName').innerHTML=curM.model+(curM.sub?` <small>${curM.sub}</small>`:'');document.getElementById('iHl').hidden=!curM.hl;document.getElementById('iHl').textContent=curM.hl||'';document.getElementById('iList').innerHTML=curM.pts.map(p=>`<li>${p}</li>`).join('');
  document.getElementById('bSheet').hidden=!curM.sheet;requestAnimationFrame(()=>im.classList.remove('sw'))};
 if(instant)apply();else{im.classList.add('sw');setTimeout(apply,280)}}

/* ---------- fascio di luce verso il profilo ---------- */
let sel=null,beamT=0;const beam=document.getElementById('beam'),bp=document.getElementById('bp'),bc=document.getElementById('bc'),grad=document.getElementById('bg1');
const pv=new THREE.Vector3();
function proj(w,x,y,z){pv.set(x,y,z);w.localToWorld(pv);pv.project(camera);return[(pv.x+1)/2*innerWidth,(-pv.y+1)/2*innerHeight]}
function drawBeam(){
 if(!sel||beamT<=0){beam.style.opacity=0;return}
 const {ow,oh,D}=sel.userData,img=document.getElementById('iImg').getBoundingClientRect();
 let a,b,c,d;
 if(!mobile){a=proj(sel,-ow/2,oh/2,-D/2);b=proj(sel,-ow/2,-oh/2,-D/2);
  const tx=img.left+img.width*.62;c=[tx,img.top+img.height*.4];d=[tx,img.top+img.height*.75];}
 else{a=proj(sel,-ow/2,-oh/2,-D/2);b=proj(sel,ow/2,-oh/2,-D/2);
  c=[img.left+img.width*.75,img.top+img.height*.3];d=[img.left+img.width*.25,img.top+img.height*.3];}
 // il fascio "cresce" dalla finestra verso il profilo
 const k=beamT,lerp2=(p,q)=>[p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k];
 const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],c2=lerp2(mid,c),d2=lerp2(mid,d);
 const pts=[a,b,d2,c2].map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
 bp.setAttribute('points',pts);
 const cm=[(c2[0]+d2[0])/2,(c2[1]+d2[1])/2],core=[lerp2(mid,[mid[0]+(a[0]-mid[0])*.35,mid[1]+(a[1]-mid[1])*.35]),[mid[0]+(b[0]-mid[0])*.35,mid[1]+(b[1]-mid[1])*.35],[cm[0]+(d2[0]-cm[0])*.4,cm[1]+(d2[1]-cm[1])*.4],[cm[0]+(c2[0]-cm[0])*.4,cm[1]+(c2[1]-cm[1])*.4]];
 core[0]=[mid[0]+(a[0]-mid[0])*.35,mid[1]+(a[1]-mid[1])*.35];
 bc.setAttribute('points',core.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' '));
 grad.setAttribute('x1',mid[0]);grad.setAttribute('y1',mid[1]);grad.setAttribute('x2',cm[0]);grad.setAttribute('y2',cm[1]);
 beam.style.opacity=Math.min(1,k*1.4)*(.85+Math.sin(performance.now()/700)*.08);
}

const gl=document.getElementById('gl'),ttlEl=document.querySelector('.ttl');
const gp=M.map((_,i)=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');
 g.innerHTML='<path class="g0"/><path class="g1" style="animation-delay:'+(i*.6)+'s"/><circle r="3"/>';gl.appendChild(g);return g});
function placeGuides(){if(busy)return;const r=ttlEl.getBoundingClientRect(),sx=innerWidth/2,sy=r.bottom+8;
 wins.forEach((w,i)=>{v.set(w.position.x,w.position.y+H/2+.04,0).project(camera);const ex=(v.x+1)/2*innerWidth,ey=(-v.y+1)/2*innerHeight;
  const my=sy+(ey-sy)*.55,d=`M${sx.toFixed(1)},${sy.toFixed(1)} C${sx.toFixed(1)},${my.toFixed(1)} ${ex.toFixed(1)},${(sy+(ey-sy)*.35).toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;

/* ---------- fibre di luce sullo sfondo (come nella home) ---------- */
(function(){const cv=document.getElementById('fib'),ctx=cv.getContext('2d');if(!ctx)return;const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let W2=0,H2=0,F=[];const t0=performance.now();
 function build(){const dpr=Math.min(1.5,devicePixelRatio||1);W2=innerWidth;H2=innerHeight;cv.width=W2*dpr;cv.height=H2*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  // zona occupata dalle finestre (proiettata)
  v.set(-GAP-W/2,H/2,0).project(camera);const x0=(v.x+1)/2*W2,y0=(-v.y+1)/2*H2;v.set(GAP+W/2,-H/2,0).project(camera);const x1=(v.x+1)/2*W2,y1=(-v.y+1)/2*H2;
  F=[];const N=W2<700?24:46;
  for(let i=0;i<N;i++){const side=i%2?1:-1,hug=i%3!==0;let p;
   if(hug){const x=side<0?x0-10-Math.random()*Math.min(160,x0):x1+10+Math.random()*Math.min(160,W2-x1);const bow=side*(30+Math.random()*120);
    p=[{x:x+bow*.6,y:-40},{x:x+bow,y:H2*.25+Math.random()*H2*.2},{x:x-bow*.3,y:H2*.55+Math.random()*H2*.2},{x:x+bow*.4,y:H2+40}]}
   else{const sx=side<0?-40:W2+40,sy=Math.random()*H2,ex=x0+Math.random()*(x1-x0),ey=Math.random()<.5?y0-20-Math.random()*60:y1+20+Math.random()*60;
    p=[{x:sx,y:sy},{x:sx-side*W2*.25,y:sy+(Math.random()-.5)*H2*.5},{x:ex+side*60,y:ey+(Math.random()-.5)*160},{x:ex,y:ey}]}
   F.push({p,len:60+Math.random()*120,gap:220+Math.random()*320,sp:40+Math.random()*70,ph:Math.random()*1000,w:.6+Math.random()*1.2,a:.25+Math.random()*.45})}}
 function path(f){ctx.beginPath();ctx.moveTo(f.p[0].x,f.p[0].y);ctx.bezierCurveTo(f.p[1].x,f.p[1].y,f.p[2].x,f.p[2].y,f.p[3].x,f.p[3].y)}
 function draw(now){cv.classList.toggle('quiet',document.getElementById('info').classList.contains('on'));const t=(now-t0)/1000,boost=busy?1.8:1;ctx.clearRect(0,0,W2,H2);
  for(const f of F){path(f);ctx.setLineDash([]);ctx.lineWidth=f.w;ctx.strokeStyle=`rgba(53,208,255,${.07*boost})`;ctx.stroke();
   ctx.setLineDash([f.len,f.gap]);ctx.lineDashOffset=-(t*f.sp*boost+f.ph);ctx.lineWidth=f.w*2.6;ctx.strokeStyle=`rgba(53,208,255,${f.a*.35*boost})`;ctx.stroke();
   ctx.lineWidth=f.w;ctx.strokeStyle=`rgba(210,245,255,${Math.min(1,f.a*boost)})`;ctx.stroke()}
  ctx.setLineDash([]);if(!RM)requestAnimationFrame(draw)}
 build();addEventListener('resize',()=>{build();if(RM)draw(performance.now())});requestAnimationFrame(draw)})();
/* ---------- lente d'ingrandimento sul profilo ---------- */
(function(){const IM=[document.getElementById('iImg'),document.getElementById('iImg2')];let img=IM[0];const lens=document.getElementById('lens'),Z=2.6;let on=false,touch=false;
 if(matchMedia('(hover:none)').matches)document.getElementById('zh').textContent='🔍 Tieni premuto e trascina';
 function box(){const r=img.getBoundingClientRect(),nw=img.naturalWidth||r.width,nh=img.naturalHeight||r.height,k=Math.min(r.width/nw,r.height/nh),w=nw*k,h=nh*k;
  return{l:r.left+(r.width-w)/2,t:r.top+(r.height-h)/2,w,h}}
 function move(e){if(!on)return;const b=box(),x=e.clientX-b.l,y=e.clientY-b.t;
  if(x<0||y<0||x>b.w||y>b.h){if(!touch){lens.style.display='none';return}}
  lens.style.display='block';const L=lens.offsetWidth,R=L/2;
  const cx=Math.max(0,Math.min(b.w,x)),cy=Math.max(0,Math.min(b.h,y));
  lens.style.backgroundImage=`url("${img.src}")`;lens.style.backgroundSize=`${b.w*Z}px ${b.h*Z}px`;
  lens.style.backgroundPosition=`${-(cx*Z-R)}px ${-(cy*Z-R)}px`;
  const oy=touch?-(R+70):0;lens.style.left=(e.clientX-R)+'px';lens.style.top=(e.clientY-R+oy)+'px'}
 const off=()=>{on=false;lens.style.display='none'};
 IM.forEach(el=>{
 el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){img=el;on=true;touch=false;move(e)}});
 el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){img=el;on=true;touch=true;el.setPointerCapture(e.pointerId);move(e);e.preventDefault()}});
 el.addEventListener('pointermove',e=>{if(img===el)move(e)});
 el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')off()});
 el.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')off()});el.addEventListener('pointercancel',off)});
 document.getElementById('close').addEventListener('click',off);
})();
window.__vt={choose,closeAll};
